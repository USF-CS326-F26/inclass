[package]
name = "week07"
version = "0.1.0"
edition = "2021"

# Each file in src/bin/ is its own bare-metal RISC-V program, and src/lib.rs is
# the small runtime they share. `cargo run` boots one under QEMU (.cargo/):
#   cargo run --bin 01_the_boot_rom
[dependencies]

[lib]
test = false
doctest = false

# Bare metal: there is nothing to unwind into. opt-level 1, as in week 6, so
# the compiler does what it does to real kernels. Overflow checks stay on, as
# in any dev build.
[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
